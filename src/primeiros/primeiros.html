<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <title>CRATOS — Primeiros passos</title>
  <style>
    :root { --vermelho: #e11d1d; --borda: #2a2a2a; --nota: #8a8a8a; }
    body { font-family: system-ui, sans-serif; background: #000; color: #e8e8e8; max-width: 860px; margin: 0 auto 48px; padding: 0 20px; }
    h1 { font-size: 20px; letter-spacing: .04em; border-bottom: 1px solid var(--borda); padding-bottom: 10px; margin-top: 24px; }
    .intro { color: #c8c8c8; font-size: 14px; line-height: 1.5; }
    .passo { border: 1px solid var(--borda); border-radius: 8px; padding: 14px; margin: 16px 0; }
    .passo h2 { font-size: 15px; margin: 0 0 8px; display: flex; align-items: center; gap: 10px; }
    .chip { font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 10px; }
    .chip.pronto { background: #12351f; color: #4ade80; }
    .chip.pendente { background: #3a2a05; color: #facc15; }
    .chip.opcional { background: #222; color: #b0b0b0; }
    .campo { margin: 10px 0; }
    label { display: block; color: #b0b0b0; font-size: 13px; margin-bottom: 4px; }
    .nota { color: var(--nota); font-size: 12px; margin-top: 4px; line-height: 1.4; }
    input[type=text], select { width: 100%; max-width: 440px; background: #111; color: #e8e8e8; border: 1px solid #444; border-radius: 6px; padding: 6px; }
    .op { display: inline-flex; gap: 6px; align-items: center; margin-right: 14px; color: #e8e8e8; font-size: 13px; }
    button { padding: 6px 14px; background: #1a1a1a; color: #e8e8e8; border: 1px solid #444; border-radius: 7px; cursor: pointer; }
    button.principal { background: var(--vermelho); border-color: var(--vermelho); color: #fff; font-weight: 600; padding: 9px 18px; }
    #pp-salvo { color: #4ade80; font-size: 13px; margin-left: 10px; }
  </style>
</head>
<body>
  <h1>CRATOS — Primeiros passos</h1>
  <p class="intro">Configure aqui o essencial para os convênios funcionarem. Pode parar no meio e voltar depois pelo botão
    <b>"Abrir os Primeiros passos"</b> nas Preferências. Nenhum sistema é aberto sem o seu clique.</p>
  <div id="passos"></div>
  <div style="margin-top:20px;display:flex;align-items:center;gap:12px;flex-wrap:wrap">
    <button class="principal" id="pp-salvar">Salvar</button>
    <button id="pp-preferencias">Abrir as Preferências completas</button>
    <button id="pp-manual">Manual do usuário</button>
    <span id="pp-salvo"></span>
  </div>
  <script src="../comum/storage.js"></script>
  <script src="../modulos/renajud-orgaos.js"></script>
  <script src="primeiros.js"></script>
</body>
</html>
